[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "multilayer"
version = "0.1.2"
description = "Мультислой — локальный менеджер виртуальных машин QEMU/KVM"
requires-python = ">=3.11"
authors = [{name = "Горшков Сергей Владимирович"}]
dependencies = ["PySide6>=6.8,<6.9", "pycdlib>=1.14,<1.15", "psutil>=6.1,<7", "pywin32>=308,<310; sys_platform == 'win32'"]

[project.urls]
Homepage = "https://nookbat.ru"
Repository = "https://github.com/Serge-Nook/multilayer"

[project.scripts]
multilayer = "multilayer.cli:main"

[project.optional-dependencies]
dev = ["ruff>=0.11,<0.12", "mypy>=1.15,<1.16", "pyinstaller>=6.12,<6.13"]

[tool.setuptools.packages.find]
include = ["multilayer*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
